<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1218"/>
      <stop offset="100%" stop-color="#142634"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe082"/>
      <stop offset="50%" stop-color="#ffb300"/>
      <stop offset="100%" stop-color="#ff8f00"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="102" fill="none" stroke="url(#cyanGrad)" stroke-width="6" stroke-opacity="0.4"/>

  <!-- Briefcase Handle -->
  <path d="M 196 150 C 196 122, 218 100, 246 100 L 266 100 C 294 100, 316 122, 316 150 L 316 170 L 196 170 Z" fill="none" stroke="url(#cyanGrad)" stroke-width="20" stroke-linecap="round"/>

  <!-- Briefcase Body -->
  <rect x="96" y="170" width="320" height="230" rx="32" fill="url(#goldGrad)" filter="url(#glow)"/>

  <!-- Briefcase Corner Accents -->
  <path d="M 96 240 L 416 240" fill="none" stroke="#0a1218" stroke-width="12" stroke-opacity="0.3"/>
  <rect x="226" y="222" width="60" height="36" rx="8" fill="#0a1218"/>
  <circle cx="256" cy="240" r="7" fill="url(#cyanGrad)"/>

  <!-- Music Note Overlay -->
  <g fill="url(#cyanGrad)" filter="url(#glow)">
    <!-- Note Stem 1 -->
    <rect x="290" y="270" width="14" height="75" rx="7"/>
    <!-- Note Stem 2 -->
    <rect x="340" y="250" width="14" height="85" rx="7"/>
    <!-- Beam -->
    <path d="M 290 270 L 354 250 L 354 272 L 290 292 Z"/>
    <!-- Note Heads -->
    <ellipse cx="276" cy="345" rx="20" ry="15" transform="rotate(-20 276 345)"/>
    <ellipse cx="326" cy="335" rx="20" ry="15" transform="rotate(-20 326 335)"/>
  </g>
</svg>
