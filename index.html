    function shuffle(list) {
      const arr = list.slice();
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    const PLAYLIST = shuffle(TRACKS);

    const SLIDE_INTERVAL_MS = 7000;
    const bgSliderEl = document.getElementById("bg-slider");
    let slideIndex = 0;
    let slideTimer = null;
    let slideListKey = "";

    function escapeAttr(src) {
      return String(src).replace(/&/g, "&amp;").replace(/"/g, "&quot;");
    }

    async function loadSlides() {
      if (!bgSliderEl) return;
      let images = [];
      const fallbackImages = [
        "data/bg.png",
        "data/3d-rendering-business-meeting-room-office-building.jpg",
        "data/3w44hh.jpg",
        "data/Audiovisual Services and Solutions for Meeting Rooms.webp",
        "data/How-Hybrid-Work-Is-Shaping-the-Future-of-AV-Meeting-Spaces.webp",
        "data/Zoom-Office-4-e1691595920875.webp",
        "data/luxury-nightclub-features-modern-decor-lighting-equipment-generated-by-ai.jpg",
        "data/messy-boardroom-after-a-long-business-meeting-photo.jpg",
        "data/studio-arrangement-work.jpg"
      ];
      try {
        const res = await fetch("/api/slides?t=" + Date.now(), { cache: "no-store" });
        if (res.ok) {
          const data = await res.json();
          if (Array.isArray(data) && data.length > 0) images = data.filter(Boolean);
        }
      } catch (err) {
        images = fallbackImages;
      }
      if (!images.length) images = fallbackImages;

      const key = images.join("|");
      if (key === slideListKey) return;
      slideListKey = key;

      const currentSrc = bgSliderEl.querySelector(".slide.active img")?.getAttribute("src");
      let startAt = images.indexOf(currentSrc);
      if (startAt < 0) startAt = 0;

      bgSliderEl.innerHTML = images.map((src, i) =>
        `<div class="slide${i === startAt ? " active" : ""}"><img src="${escapeAttr(src)}" alt=""></div>`
      ).join("");
      slideIndex = startAt;
      if (images.length > 1) startSlider();
      else stopSlider();
    }

    function startSlider() {
      stopSlider();
      slideTimer = setInterval(nextSlide, SLIDE_INTERVAL_MS);
    }

    function stopSlider() {
      clearInterval(slideTimer);
      slideTimer = null;
    }

    function nextSlide() {
      const slides = bgSliderEl.querySelectorAll(".slide");
      if (slides.length < 2) return;
      slides[slideIndex].classList.remove("active");
      slideIndex = (slideIndex + 1) % slides.length;
      slides[slideIndex].classList.add("active");
    }

    loadSlides();
    setInterval(loadSlides, 10000);

    const clockEl = document.getElementById("clock");
    const onlineEl = document.getElementById("online-count");

    const artEl = document.getElementById("art");
    const artImgEl = document.getElementById("art-img");
    const trackTitleEl = document.getElementById("track-title");
    const trackArtistEl = document.getElementById("track-artist");

    const progressBarEl = document.getElementById("progress-bar");
    const progressFillEl = document.getElementById("progress-fill");
    const progressHandleEl = document.getElementById("progress-handle");
    const timeCurrentEl = document.getElementById("time-current");
    const timeTotalEl = document.getElementById("time-total");

    const playBtn = document.getElementById("play-btn");
    const playIcon = document.getElementById("play-icon");
    const prevBtn = document.getElementById("prev-btn");
    const nextBtn = document.getElementById("next-btn");

    const ICON_PLAY = '<path d="M8 5v14l11-7z"/>';
    const ICON_PAUSE = '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>';

    function updateClock() {
      const now = new Date();
      let h = now.getHours();
      const m = String(now.getMinutes()).padStart(2, "0");
      const ampm = h >= 12 ? "pm" : "am";
      h = h % 12 || 12;
      clockEl.textContent = `${h}:${m} ${ampm}`;
    }
    updateClock();
    setInterval(updateClock, 1000);

    function visitorId() {
      const key = "cm_visitor_id";
      let id = localStorage.getItem(key);
      if (!id) {
        id = (crypto.randomUUID && crypto.randomUUID()) ||
          ("v" + Math.random().toString(36).slice(2) + Date.now().toString(36));
        localStorage.setItem(key, id);
      }
      return id;
    }

    function formatCount(n) {
      n = Number(n) || 0;
      return n.toLocaleString("en-IN");
    }

    function getLocalStore() {
      try {
        const raw = localStorage.getItem("cm_stats_v2");
        if (raw) return JSON.parse(raw);
      } catch (e) { }
      return { total_views: 0, days: {} };
    }

    function saveLocalStore(store) {
      try {
        localStorage.setItem("cm_stats_v2", JSON.stringify(store));
      } catch (e) { }
    }

    function computeLocalStats() {
      const store = getLocalStore();
      const vid = visitorId();

      const now = new Date();
      const today = now.toLocaleDateString("en-CA", { timeZone: "Asia/Kolkata" });

      if (!sessionStorage.getItem("cm_hit_sent")) {
        store.total_views = (store.total_views || 0) + 1;
        if (!store.days[today]) store.days[today] = { views: 0, users: {} };
        store.days[today].views = (store.days[today].views || 0) + 1;
        store.days[today].users[vid] = true;
        saveLocalStore(store);
      }

      const d = new Date(now);
      const dow = d.getDay() || 7;
      d.setDate(d.getDate() - (dow - 1));
      const weekStart = d.toLocaleDateString("en-CA", { timeZone: "Asia/Kolkata" });
      const monthStart = today.slice(0, 8) + "01";
      const yearStart = today.slice(0, 4) + "-01-01";

      function summarizeRange(from, to) {
        let views = 0;
        const users = {};
        for (const [dayKey, row] of Object.entries(store.days || {})) {
          if (dayKey >= from && dayKey <= to) {
            views += Number(row.views || 0);
            for (const u of Object.keys(row.users || {})) {
              if (row.users[u]) users[u] = true;
            }
          }
        }
        return { views, users: Math.max(1, Object.keys(users).length) };
      }

      const totalUsers = {};
      for (const row of Object.values(store.days || {})) {
        for (const u of Object.keys(row.users || {})) {
          if (row.users[u]) totalUsers[u] = true;
        }
      }

      return {
        online: 1,
        today: summarizeRange(today, today),
        week: summarizeRange(weekStart, today),
        month: summarizeRange(monthStart, today),
        year: summarizeRange(yearStart, today),
        total: {
          views: store.total_views || 1,
          users: Math.max(1, Object.keys(totalUsers).length),
        },
      };
    }

    function mergeStats(serverData) {
      const local = computeLocalStats();
      if (!serverData || typeof serverData !== "object") return local;

      const mergeRow = (srv, loc) => ({
        views: Math.max(Number(srv?.views || 0), Number(loc?.views || 0)),
        users: Math.max(Number(srv?.users || 0), Number(loc?.users || 0)),
      });

      return {
        online: Math.max(Number(serverData.online || 1), 1),
        today: mergeRow(serverData.today, local.today),
        week: mergeRow(serverData.week, local.week),
        month: mergeRow(serverData.month, local.month),
        year: mergeRow(serverData.year, local.year),
        total: mergeRow(serverData.total, local.total),
      };
    }

    function renderStats(data) {
      const merged = mergeStats(data);
      if (typeof merged.online === "number") {
        onlineEl.textContent = `${formatCount(merged.online)} online`;
      }
      const periods = ["today", "week", "month", "year", "total"];
      periods.forEach((key) => {
        const row = merged[key];
        if (!row) return;
        const viewsEl = document.getElementById("views-" + key);
        const usersEl = document.getElementById("users-" + key);
        if (viewsEl) viewsEl.textContent = formatCount(row.views);
        if (usersEl) usersEl.textContent = formatCount(row.users) + " users";
      });
    }

    let pendingHit = !sessionStorage.getItem("cm_hit_sent");

    async function pingOnline(leave) {
      const hit = pendingHit && !leave;
      renderStats(null);
      try {
        const res = await fetch("/api/online", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id: visitorId(), leave: !!leave, hit }),
          keepalive: true,
        });
        if (res.ok) {
          const data = await res.json();
          renderStats(data);
        }
        if (hit) {
          sessionStorage.setItem("cm_hit_sent", "1");
          pendingHit = false;
        }
      } catch (err) {
        renderStats(null);
      }
    }

    pingOnline(false);
    setInterval(() => pingOnline(false), 12000);

    window.addEventListener("pagehide", () => {
      const fd = new FormData();
      fd.append("id", visitorId());
      fd.append("leave", "1");
      if (navigator.sendBeacon) {
        navigator.sendBeacon("/api/online", fd);
      } else {
        pingOnline(true);
      }
    });

    let player = null;
    let duration = 0;
    let progressTimer = null;
    let currentTrackIndex = 0;

    function formatTime(sec) {
      sec = Math.max(0, Math.floor(sec || 0));
      const m = Math.floor(sec / 60);
      const s = String(sec % 60).padStart(2, "0");
      return `${m}:${s}`;
    }

    function randomIndex(skipCurrent) {
      if (PLAYLIST.length <= 1) return 0;
      let next = Math.floor(Math.random() * PLAYLIST.length);
      if (skipCurrent) {
        while (next === currentTrackIndex) {
          next = Math.floor(Math.random() * PLAYLIST.length);
        }
      }
      return next;
    }

    function tryStartPlayback() {
      if (!player || !player.playVideo) return;
      try {
        player.unMute();
        player.setVolume(100);
        player.playVideo();
      } catch (err) { }
    }

    function unlockAudio() {
      tryStartPlayback();
      window.removeEventListener("pointerdown", unlockAudio);
      window.removeEventListener("keydown", unlockAudio);
      window.removeEventListener("touchstart", unlockAudio);
    }

    window.addEventListener("pointerdown", unlockAudio, { once: true });
    window.addEventListener("keydown", unlockAudio, { once: true });
    window.addEventListener("touchstart", unlockAudio, { once: true });

    window.onYouTubeIframeAPIReady = function () {
      currentTrackIndex = randomIndex(false);
      const playerVars = {
        autoplay: 1,
        mute: 1,
        enablejsapi: 1,
        controls: 0,
        rel: 0,
        playsinline: 1,
      };

      if (window.location.origin && window.location.origin !== "null" && window.location.protocol.startsWith("http")) {
        playerVars.origin = window.location.origin;
      }

      player = new YT.Player("yt-player-mount", {
        height: "200",
        width: "200",
        videoId: PLAYLIST[currentTrackIndex].id,
        playerVars,
        events: {
          onReady: onPlayerReady,
          onStateChange: onPlayerStateChange,
          onError: onPlayerError,
        },
      });
    };

    function playTrackAt(index, autoplay) {
      if (!player || !player.loadVideoById || !PLAYLIST.length) return;
      currentTrackIndex = (index + PLAYLIST.length) % PLAYLIST.length;
      const id = PLAYLIST[currentTrackIndex].id;
      if (autoplay) {
        player.loadVideoById(id);
      } else {
        player.cueVideoById(id);
      }
    }

    function onPlayerReady() {
      updateTrackInfo();
      const iframe = player.getIframe && player.getIframe();
      if (iframe) {
        iframe.setAttribute("allow", "autoplay; encrypted-media");
        iframe.allow = "autoplay; encrypted-media";
      }
      player.mute();
      player.playVideo();
      setTimeout(tryStartPlayback, 250);
      setTimeout(tryStartPlayback, 1000);
      setTimeout(tryStartPlayback, 2500);
    }

    const YT_ERROR_MESSAGES = {
      2: "Invalid video parameter or ID",
      5: "HTML5 player error or video can't be played in embedded player",
      100: "Video not found (removed or set to private)",
      101: "The video owner has disabled embedded playback",
      150: "The video owner has disabled embedded playback",
    };

    let skipAttempts = 0;
    const MAX_SKIP_ATTEMPTS = 8;

    function onPlayerError(e) {
      const canSkip = PLAYLIST.length > 1 && skipAttempts < MAX_SKIP_ATTEMPTS;
      if (canSkip) {
        skipAttempts++;
        trackTitleEl.textContent = YT_ERROR_MESSAGES[e.data] || "Couldn't load track";
        trackArtistEl.textContent = "Skipping to next track…";
        playTrackAt(randomIndex(true), true);
        return;
      }
      trackTitleEl.textContent = YT_ERROR_MESSAGES[e.data] || "Couldn't load track";
      trackArtistEl.textContent = "Not embeddable — try next";
    }

    function onPlayerStateChange(e) {
      if (e.data === YT.PlayerState.PLAYING) {
        skipAttempts = 0;
        setPlayingUI(true);
        updateTrackInfo();
        startProgressTimer();
      } else if (e.data === YT.PlayerState.PAUSED) {
        setPlayingUI(false);
        stopProgressTimer();
      } else if (e.data === YT.PlayerState.ENDED) {
        setPlayingUI(false);
        stopProgressTimer();
        playTrackAt(randomIndex(true), true);
      }
    }

    function setPlayingUI(isPlaying) {
      artEl.classList.toggle("playing", isPlaying);
      bgSliderEl.classList.toggle("paused", !isPlaying);
      const currentIcon = document.getElementById("play-icon");
      if (currentIcon) {
        currentIcon.innerHTML = isPlaying ? ICON_PAUSE : ICON_PLAY;
      }
    }

    function updateTrackInfo() {
      if (!player || !player.getVideoData) return;
      const data = player.getVideoData();
      trackTitleEl.textContent = data.title || "Unknown track";
      trackArtistEl.textContent = data.author || "YouTube Music";
      if (data.video_id) {
        artImgEl.src = `https://i.ytimg.com/vi/${data.video_id}/mqdefault.jpg`;
      }
      duration = player.getDuration() || 0;
      timeTotalEl.textContent = formatTime(duration);
    }

    function startProgressTimer() {
      stopProgressTimer();
      progressTimer = setInterval(() => {
        if (!player || !player.getCurrentTime) return;
        const current = player.getCurrentTime() || 0;
        duration = player.getDuration() || duration;
        const pct = duration ? (current / duration) * 100 : 0;
        progressFillEl.style.width = pct + "%";
        progressHandleEl.style.left = pct + "%";
        timeCurrentEl.textContent = formatTime(current);
        timeTotalEl.textContent = formatTime(duration);
      }, 500);
    }

    function stopProgressTimer() {
      clearInterval(progressTimer);
    }

    playBtn.addEventListener("click", () => {
      if (!player || !player.getPlayerState) return;
      const state = player.getPlayerState();
      if (state === YT.PlayerState.PLAYING) {
        player.pauseVideo();
      } else {
        player.playVideo();
      }
    });

    prevBtn.addEventListener("click", () => {
      playTrackAt(randomIndex(true), true);
    });

    nextBtn.addEventListener("click", () => {
      playTrackAt(randomIndex(true), true);
    });

    progressBarEl.addEventListener("click", (e) => {
      if (!player || !player.seekTo || !duration) return;
      const rect = progressBarEl.getBoundingClientRect();
      const ratio = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
      player.seekTo(ratio * duration, true);
    });
